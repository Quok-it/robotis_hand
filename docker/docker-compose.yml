services:
  robotis_hand:
    container_name: robotis_hand
    # Local image with patched dynamixel_hardware_interface: tolerates the stale
    # hardware-error alert flag latched on the HX5 controller (ID 110), which the
    # stock 0.3.0 driver treats as fatal. Source patch: src/dynamixel/dynamixel.cpp
    # inside the image. Revert to robotis/robotis-hand:0.3.0 once fixed upstream.
    image: robotis/robotis-hand:0.3.0-hx5-alertfix
    tty: true
    restart: always
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    network_mode: host
    ipc: host
    pid: host
    environment:
     - DISPLAY=${DISPLAY}
     - QT_X11_NO_MITSHM=1
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - ./workspace:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ../:/root/ros2_ws/src/robotis_hand/
    privileged: true
    command: bash
